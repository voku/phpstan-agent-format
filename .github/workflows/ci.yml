name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: PHPStan (default formatter)
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --no-progress

      - name: PHPStan (agent formatter dogfood)
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --error-format=agent --no-progress

      - name: PHPStan (default vs grouped report compare)
        run: composer phpstan-compare

      - name: PHPStan (reduced grouped report compare)
        run: composer phpstan-compare-reduced

      - name: PHPStan (agent formatter fixture dogfood)
        run: |
          set +e
          vendor/bin/phpstan analyse --configuration tests/Config/phpstan-agent-fixtures.neon --error-format=agent --no-progress > /tmp/phpstan-agent-fixtures.json
          status=$?
          set -e
          test "$status" -eq 1
          php -r '$payload = json_decode(file_get_contents("/tmp/phpstan-agent-fixtures.json"), true, 512, JSON_THROW_ON_ERROR); if (($payload["summary"]["totalIssues"] ?? 0) < 1) { fwrite(STDERR, "Expected fixture issues.\n"); exit(1); }'

      - name: PHPStan (agent formatter clean fixture dogfood)
        run: |
          vendor/bin/phpstan analyse --configuration tests/Config/phpstan-agent-clean.neon --error-format=agent --no-progress > /tmp/phpstan-agent-clean.json
          php -r 'require "vendor/autoload.php"; $payload = HelgeSverre\Toon\Toon::decode(file_get_contents("/tmp/phpstan-agent-clean.json")); if (($payload["summary"]["totalIssues"] ?? -1) !== 0) { fwrite(STDERR, "Expected zero fixture issues.\n"); exit(1); }'

      - name: PHPStan (agent formatter reduced fixture dogfood)
        run: |
          set +e
          vendor/bin/phpstan analyse --configuration tests/Config/phpstan-agent-reduced.neon --error-format=agent --no-progress > /tmp/phpstan-agent-reduced.json
          status=$?
          set -e
          test "$status" -eq 1
          php -r '$payload = json_decode(file_get_contents("/tmp/phpstan-agent-reduced.json"), true, 512, JSON_THROW_ON_ERROR); if (($payload["summary"]["tokenStats"]["wasReduced"] ?? false) !== true) { fwrite(STDERR, "Expected reduced payload.\n"); exit(1); } if (($payload["summary"]["suppressedDuplicates"] ?? 0) < 1) { fwrite(STDERR, "Expected suppressed duplicates.\n"); exit(1); }'

  itp-context-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout pinned itp-context
        uses: actions/checkout@v7
        with:
          repository: voku/itp-context
          ref: 0.4.0
          path: _integration/itp-context
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer install --working-dir=_integration/itp-context --no-dev --prefer-dist --no-interaction --no-progress

      - name: Test (agentFormat.itpContext end to end)
        run: composer test
        env:
          ITP_CONTEXT_DIR: ${{ github.workspace }}/_integration/itp-context
          ITP_CONTEXT_REQUIRED: '1'

  phpstan-2-1-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install PHPStan 2.1.50 within supported constraint
        run: composer update phpstan/phpstan:2.1.50 phpstan/phpstan-strict-rules:2.0.11 --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Verify PHPStan version
        run: vendor/bin/phpstan --version | grep -F '2.1.50'

      - name: PHPStan 2.1 clean CLI smoke
        run: vendor/bin/phpstan analyse --configuration tests/Config/phpstan-agent-clean.neon --error-format=json --no-progress

      - name: Test legacy integration
        run: composer test

      - name: PHPStan (legacy API)
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --no-progress

  phpstan-2-3-legacy-strict-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install supported mixed-version dependency graph
        run: composer update phpstan/phpstan:2.3.5 phpstan/phpstan-strict-rules:2.0.11 --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Verify both resolved package versions
        run: |
          vendor/bin/phpstan --version | grep -F '2.3.5'
          composer show phpstan/phpstan-strict-rules | grep -F 'versions : * 2.0.11'

      - name: Run actual CLI/JSON and agent parity tests
        run: composer test

      - name: PHPStan (mixed graph)
        run: vendor/bin/phpstan analyse --configuration phpstan.neon.dist --no-progress


  # Non-mutating PR-specific diagnostic; never supplies credentials to external services.
  codacy-public-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fetch public Codacy findings without authentication
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          import urllib.parse
          import urllib.request

          base = (
              'https://api.codacy.com/api/v3/analysis/organizations/gh/voku/'
              'repositories/phpstan-agent-format/pull-requests/' + os.environ['PR_NUMBER']
          )

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={'Accept': 'application/json', 'User-Agent': 'phpstan-agent-format-readonly-ci'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          pr_response = get_json(base)
          metadata = pr_response.get('data', {})
          analyzed_head = metadata.get('pullRequest', metadata).get('headCommitSha')
          expected_head = os.environ['PR_HEAD_SHA']
          print('GitHub PR head:', expected_head)
          print('Codacy PR head:', analyzed_head or '(not exposed)')
          if analyzed_head and analyzed_head != expected_head:
              raise RuntimeError('Codacy PR evidence is stale for the exact head')

          issues = []
          cursor = None
          for page in range(10):
              params = {'status': 'new', 'limit': 100}
              if cursor:
                  params['cursor'] = cursor
              response = get_json(base + '/issues?' + urllib.parse.urlencode(params))
              batch = response.get('data')
              if not isinstance(batch, list):
                  raise ValueError('Unexpected Codacy response: missing issue data list')
              issues.extend(batch)
              next_cursor = response.get('pagination', {}).get('cursor')
              if not next_cursor or next_cursor == cursor or not batch:
                  break
              cursor = next_cursor
          else:
              raise RuntimeError('Codacy pagination exceeded 10 pages; evidence incomplete')

          counts = collections.Counter(
              str(item.get('commitIssue', {}).get('patternInfo', {}).get('severityLevel', 'unknown'))
              for item in issues
          )
          result = {
              'githubHeadSha': expected_head,
              'codacyHeadSha': analyzed_head,
              'newIssuesCount': len(issues),
              'severities': dict(counts),
              'issues': issues,
          }
          with open('codacy-issues.json', 'w', encoding='utf-8') as output:
              json.dump(result, output, ensure_ascii=False, indent=2)

          print('Codacy issues:', len(issues), 'by severity:', dict(counts))
          for entry in issues[:20]:
              issue = entry.get('commitIssue', {})
              rule = issue.get('patternInfo', {})
              print(json.dumps({
                  'path': issue.get('filePath'),
                  'line': issue.get('lineNumber'),
                  'severity': rule.get('severityLevel'),
                  'tool': issue.get('toolInfo', {}).get('name'),
                  'rule': rule.get('id'),
                  'message': issue.get('message'),
              }, ensure_ascii=False))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(
                  '### Codacy public PR findings (read-only)\\n'
                  f'GitHub head: \`{expected_head}\`\\n\\n'
                  f'Codacy head: \`{analyzed_head or "not exposed"}\`\\n\\n'
                  f'New issues: **{len(issues)}**; by severity: \`{dict(counts)}\`\\n'
                  'Full issue details are in the uploaded \`codacy-issues.json\` artifact.\\n'
              )
          PY

      - name: Upload Codacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codacy-public-issues
          path: codacy-issues.json
          if-no-files-found: warn
          retention-days: 7
